name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish.
# github.workflow names the caller under workflow_call, so a release's checks get their
# own group and a push to main (e.g. a Renovate merge) cannot cancel them while pending.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Format
        run: test -z "$(gofmt -l cmd internal web data | tee /dev/stderr)"
      - run: go vet ./...
      - name: Tests (calculation, SQLite integration, API, Typst export)
        run: go test ./...
        env:
          SPESEN_TYPST: typst

  web:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generated API client is up to date
        working-directory: .
        run: |
          go run ./cmd/spesen openapi > web/openapi.json
          pnpm --dir web gen:api
          git diff --exit-code -- web/openapi.json web/src/api/gen

  e2e:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: CGO_ENABLED=0 go build -o bin/spesen ./cmd/spesen
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Playwright (F01 flow, 360 px layout)
        run: pnpm --dir web e2e
        env:
          CI: "1"
          SPESEN_BIN: ${{ github.workspace }}/bin/spesen
          SPESEN_TYPST: typst
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: spesen:ci
          cache-from: type=gha
      - name: Start nonroot with read-only root filesystem
        run: |
          docker run -d --name spesen --read-only --tmpfs /tmp -v spesen-data:/data -p 8080:8080 \
            -e SPESEN_SETUP_TOKEN=ci spesen:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/api/session || { docker logs spesen; exit 1; }
          docker exec spesen /usr/local/bin/typst --version
          test "$(docker inspect -f '{{.Config.User}}' spesen)" = "nonroot:nonroot"
      - if: failure()
        run: docker logs spesen || true
