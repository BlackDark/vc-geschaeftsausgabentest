name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish.
# github.workflow names the caller under workflow_call, so a release's checks get their
# own group and a push to main (e.g. a Renovate merge) cannot cancel them while pending.
# `changes` detects which areas a PR touches via git diff (HEAD^1..HEAD on the merge commit);
# push/workflow_call/workflow_dispatch run everything. Draft PRs skip `changes`, so every area
# job (needs: changes) is skipped too, and `check` (if: always()) still passes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.221.1"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.areas.outputs.lint }}
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      docker: ${{ steps.areas.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base parent
          persist-credentials: false
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            {
              echo "lint=true"
              echo "go=true"
              echo "web=true"
              echo "e2e=true"
              echo "docker=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          has() { grep -qE "$1" <<< "$changed" && echo true || echo false; }
          go=$(has '^(cmd/|internal/|data/|go\.(mod|sum)$|mise\.toml$)')
          web=$(has '^(web/|mise\.toml$)')
          docker=$(has '^(docker/|cmd/|internal/|data/|web/|go\.(mod|sum)$)')
          # e2e builds and exercises both sides together, so either changing triggers it
          e2e=false
          { [ "$go" = true ] || [ "$web" = true ]; } && e2e=true
          lint=$(has '^(\.github/|renovate\.json5?$)')
          {
            echo "lint=$lint"
            echo "go=$go"
            echo "web=$web"
            echo "e2e=$e2e"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Format
        run: test -z "$(gofmt -l cmd internal web data | tee /dev/stderr)"
      - run: go vet ./...
      - name: Tests (calculation, SQLite integration, API, Typst export)
        run: go test ./...
        env:
          SPESEN_TYPST: typst

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generated API client is up to date
        working-directory: .
        run: |
          go run ./cmd/spesen openapi > web/openapi.json
          pnpm --dir web gen:api
          git diff --exit-code -- web/openapi.json web/src/api/gen

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: CGO_ENABLED=0 go build -o bin/spesen ./cmd/spesen
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Playwright (F01 flow, 360 px layout)
        run: pnpm --dir web e2e
        env:
          CI: "1"
          SPESEN_BIN: ${{ github.workspace }}/bin/spesen
          SPESEN_TYPST: typst
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: spesen:ci
          cache-from: type=gha
      - name: Start nonroot with read-only root filesystem
        run: |
          docker run -d --name spesen --read-only --tmpfs /tmp -v spesen-data:/data -p 8080:8080 \
            -e SPESEN_SETUP_TOKEN=ci spesen:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/session || { docker logs spesen; exit 1; }
          docker exec spesen /usr/local/bin/typst --version
          test "$(docker inspect -f '{{.Config.User}}' spesen)" = "nonroot:nonroot"
      - if: failure()
        run: docker logs spesen || true

  # Required check `ci` in the ruleset. Its name must stay unique across workflows: a second job
  # called `check` (lint.yml had one) satisfied the ruleset before the area jobs finished.
  # Green when every area job passed or was skipped; if: always() so a failure cannot hide.
  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color .github/workflows/*.yml

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: renovate-config-validator
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  # The one required check in the ruleset. Do not add a second workflow with its own gate:
  # required checks match by name across workflows and the fastest one would satisfy the ruleset.
  check:
    if: always()
    needs: [changes, go, web, e2e, docker, actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
